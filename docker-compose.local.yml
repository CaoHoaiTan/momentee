services:
  postgres:
    image: postgres:16-alpine
    container_name: momentee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: momentee
      POSTGRES_PASSWORD: momentee
      POSTGRES_DB: momentee
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U momentee']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: momentee-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: momentee-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://momentee:momentee@postgres:5432/momentee
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost
      JWT_SECRET: local-dev-jwt-secret-minimum-32-chars
      JWT_REFRESH_SECRET: local-dev-refresh-secret-minimum-32c
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost
        NEXT_PUBLIC_GRAPHQL_URL: http://localhost/graphql
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ''
    container_name: momentee-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - internal
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: momentee-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    networks:
      - internal
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
