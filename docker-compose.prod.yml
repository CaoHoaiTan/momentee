services:
  postgres:
    image: postgres:16-alpine
    container_name: momentee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-momentee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-momentee}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-momentee}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    container_name: momentee-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m

  server:
    image: ghcr.io/${GITHUB_REPOSITORY}/momentee-server:${IMAGE_TAG:-latest}
    container_name: momentee-server
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      # Override with Docker service hostnames
      DATABASE_URL: postgresql://${POSTGRES_USER:-momentee}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-momentee}
      REDIS_URL: ${REDIS_PASSWORD:+redis://:${REDIS_PASSWORD}@redis:6379}${REDIS_PASSWORD:-redis://redis:6379}
      CORS_ORIGIN: ${CORS_ORIGIN}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256m

  web:
    image: ghcr.io/${GITHUB_REPOSITORY}/momentee-web:${IMAGE_TAG:-latest}
    container_name: momentee-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - internal
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m

  nginx:
    image: ghcr.io/${GITHUB_REPOSITORY}/momentee-nginx:${IMAGE_TAG:-latest}
    container_name: momentee-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    networks:
      - internal
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64m

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_cache:
