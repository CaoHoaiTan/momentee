services:
  postgres:
    image: postgres:16-alpine
    container_name: momentee-postgres
    environment:
      POSTGRES_USER: momentee
      POSTGRES_PASSWORD: momentee
      POSTGRES_DB: momentee
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U momentee']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: momentee-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
