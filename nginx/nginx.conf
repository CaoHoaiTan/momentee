worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # Gzip
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript
        application/graphql+json;

    # Rate limiting zone for GraphQL endpoint
    limit_req_zone $binary_remote_addr zone=graphql:10m rate=10r/s;

    upstream server_backend {
        server server:4000;
        keepalive 16;
    }

    upstream web_backend {
        server web:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── GraphQL endpoint ───────────────────────────────────────────────────
        # Handles both HTTP queries and WebSocket upgrades (graphql-ws subscriptions)
        location /graphql {
            limit_req zone=graphql burst=20 nodelay;

            proxy_pass         http://server_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # WebSocket upgrade for graphql-ws subscriptions
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── REST API routes (health, webhooks, uploads, music proxy) ───────────
        location ~ ^/(health|api|webhook|upload) {
            proxy_pass         http://server_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── Next.js static assets (immutable, long cache) ─────────────────────
        location /_next/static/ {
            proxy_pass       http://web_backend;
            proxy_set_header Host $host;
            add_header       Cache-Control "public, max-age=31536000, immutable";
        }

        # ── Next.js image optimization ────────────────────────────────────────
        location /_next/image {
            proxy_pass       http://web_backend;
            proxy_set_header Host $host;
        }

        # ── Everything else → Next.js ─────────────────────────────────────────
        location / {
            proxy_pass         http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
        }
    }

    # WebSocket connection upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}
