      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#FF8E53"/>
      <stop offset="100%" stop-color="#FFC371"/>
    </linearGradient>
  </defs>

  <!-- Icon: Duo hearts -->
