  </g>

  <!-- Wordmark -->
  <text x="66" y="35" font-family="'Outfit', 'SF Pro Display', -apple-system, sans-serif" font-size="30" font-weight="700" fill="#1a1a2e" letter-spacing="-0.5">moment</text>
  <text x="237" y="35" font-family="'Outfit', 'SF Pro Display', -apple-system, sans-serif" font-size="30" font-weight="700" fill="#FF6B6B" letter-spacing="-0.5">ee</text>

  <!-- Tagline -->
