    <path d="M32 32 C23 24 14 17 14 10 C14 4 18 0 24 0 C28 0 31 3 32 6 C33 3 36 0 40 0 C46 0 50 4 50 10 C50 17 41 24 32 32Z" fill="#FF8E53" opacity="0.85"/>
